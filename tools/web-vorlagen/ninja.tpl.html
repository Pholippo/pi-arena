<!doctype html><html lang=de><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>NINJA-RACE</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#120d1f;font-family:system-ui,Segoe UI,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#form{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#120d1fee;z-index:5}
#form div{text-align:center}
#form h1{font-size:46px;margin:0 0 6px;color:#ff3b5c;text-shadow:0 4px 0 #6b0f20;letter-spacing:2px}
#form input{font-size:26px;padding:10px 14px;border-radius:12px;border:0;text-align:center;width:240px}
#form button,#tvbtn{font-size:24px;padding:12px 26px;border:0;border-radius:14px;background:#2ea043;color:#fff;
  font-weight:700;margin-top:14px;cursor:pointer}
#tvbtn{position:fixed;right:18px;bottom:18px;z-index:4;display:none}
@@CSS@@
</style></head><body>
<canvas id=c></canvas>
<div id=form><div><h1>NINJA-RACE</h1><p>Wie heisst du?</p>
<input id=name maxlength=14 autocomplete=off><br><button id=los>Mitlaufen!</button>
<p style="opacity:.75;line-height:1.5">◀ ▶ laufen &nbsp;·&nbsp; Leertaste / ▲ / W springen<br>
An der Wand nochmal springen = <b>Walljump</b>!<br>Wer zuerst im Ziel ist, gewinnt. 3 Minuten.</p></div></div>
<div id=touch><div><button data-k=l>◀</button><button data-k=r>▶</button></div><div><button data-k=j>▲<small>SPRUNG</small></button></div></div>
<button id=tvbtn>START</button>
<script>
window.onerror=(m)=>{window.__err=String(m);};
// ================= Level (aus dem Seed -> bei allen gleich)
@@LEVEL@@// ================= Zustand, Netz, Eingabe
@@UI@@
const TV=location.pathname.startsWith('/tv');
const QNAME=(new URLSearchParams(location.search).get('name')||'').trim().slice(0,14); // vom PiArena-Host: kein Tippen
let autoLaeuft=false;
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false}); let W=800, skala=1, bgC=null;
function groesse(){ // nur bei echter Groessenaenderung neu aufbauen; Himmel+Mond einmal in ein Offscreen-Canvas
  if(!canvasGroesse(cv)&&bgC) return; skala=cv.height/WH; W=cv.width/skala; for(const k in tbCache) delete tbCache[k];
  bgC=document.createElement('canvas'); bgC.width=cv.width; bgC.height=cv.height; const b=bgC.getContext('2d',{alpha:false});
  b.setTransform(skala,0,0,skala,0,0); const g=b.createLinearGradient(0,0,0,WH); g.addColorStop(0,'#1b1036'); g.addColorStop(1,'#4a2a5e');
  b.fillStyle=g; b.fillRect(0,0,W+1,WH); b.fillStyle='#ffe9b0'; b.beginPath(); b.arc(W<700?W*0.3:W*0.6,W<700?250:100,38,0,7); b.fill(); }
addEventListener('resize',groesse);groesse();
let id=localStorage.getItem('ninja_id')||'', meinName=localStorage.getItem('ninja_name')||'';
let st={phase:'lobby',rest:0,spieler:[],seed:1}, stZeit=performance.now(), phaseAlt='', geister={};
let ac=null;function ton(f,d=.07,typ='square',vol=.05){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();
  o.type=typ;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d+.02)}catch(e){}}
const KEYS={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'j',ArrowUp:'j',w:'w',W:'w'};
function setz(k,an){ if(k==='w')k='j'; if(k==='j'&&an&&!taste.j) sprungNeu=true; taste[k]=an; }
addEventListener('keydown',e=>{if(document.activeElement===nameEl)return;const k=KEYS[e.key];if(k){e.preventDefault();setz(k,true)}});
addEventListener('keyup',e=>{const k=KEYS[e.key];if(k)setz(k,false)});
addEventListener('blur',()=>{taste.l=taste.r=taste.j=false});
touchKnoepfe(setz);
hilfe(TOUCH?'◀ ▶ laufen · ▲ springen · Wand: nochmal ▲':'◀ ▶ / A D laufen · Leertaste / ▲ / W springen · an der Wand nochmal = Walljump · H = Hilfe aus');
const form=document.getElementById('form'), nameEl=document.getElementById('name'); nameEl.value=meinName;
async function post(p,d){const r=await fetch(p,{method:'POST',body:new URLSearchParams(d).toString(),headers:{'Content-Type':'application/x-www-form-urlencoded'}});return r.json();}
async function anmelden(){meinName=(nameEl.value||'').trim()||'Ninja';localStorage.setItem('ninja_name',meinName);
  try{const r=await post('/join',{name:meinName,id});id=r.id;localStorage.setItem('ninja_id',id);form.style.display='none';nameEl.blur();ton(880,.12,'triangle',.08);}
  catch(e){alert('Keine Verbindung zum Host');}}
document.getElementById('los').onclick=anmelden; if(QNAME&&!TV){nameEl.value=QNAME;form.style.display='none';autoLaeuft=true;anmelden().finally(()=>autoLaeuft=false);}
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')anmelden()});
if(TV){form.style.display='none';const b=document.getElementById('tvbtn');b.style.display='block';
  b.onclick=()=>post(st.phase==='spiel'||st.phase==='countdown'?'/lobby':'/start',{});}
else if(id&&meinName) anmelden();
async function netz(){
  try{ let r;
    if(TV||!id) r=await (await fetch('/state')).json();
    else { r=await post('/upd',{id,x:ich.x.toFixed(1),y:ich.y.toFixed(1),lebt:ich.lebt?'1':'0',ziel:zielZeit===null?'':zielZeit.toFixed(2)});
      if(!r.ich){id='';localStorage.removeItem('ninja_id');if(QNAME&&!TV){if(!autoLaeuft){autoLaeuft=true;anmelden().finally(()=>autoLaeuft=false);}}else form.style.display='flex';} }
    if(r.spiel && r.spiel!=='ninja'){ location.reload(); return; } // Host hat das Spiel gewechselt
    if(r.seed!==seed){ seed=r.seed; baue(seed); neu(); geister={}; }
    st=r; stZeit=performance.now();
    if(st.phase!==phaseAlt){
      if(st.phase==='countdown'){ neu(); zielZeit=null; }
      if(st.phase==='spiel'){ neu(); zielZeit=null; start=performance.now()-(st.runde_s-st.rest)*1000; ton(880,.3,'triangle',.1); }
      if(st.phase==='lobby'){ zielZeit=null; }
      if(st.phase==='ende'){ ton(523,.2); setTimeout(()=>ton(659,.2),180); setTimeout(()=>ton(784,.4),360); }
      phaseAlt=st.phase; }
  }catch(e){}
  setTimeout(netz,100);
}
// ================= Zeichnen
function ninja(x,y,farbe,alpha,blick,eigen,lauf){ // eigen: groesser, weiss umrandet, Lichtfleck am Boden
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x+PW/2,y+PH);
  if(eigen){ ctx.fillStyle='rgba(255,210,63,.45)'; ctx.beginPath(); ctx.ellipse(0,0,22,5,0,0,7); ctx.fill(); ctx.scale(1.15,1.15); }
  const bein=Math.sin(lauf*18)*6;
  if(eigen){ ctx.fillStyle='#fff'; ctx.fillRect(-11+bein*0.3,-12,11,12); ctx.fillRect(0-bein*0.3,-12,11,12); ctx.fillRect(-14.5,-32,29,26);
    ctx.beginPath(); ctx.arc(0,-31,13.5,0,7); ctx.fill(); }
  ctx.fillStyle='#14121c'; ctx.fillRect(-9+bein*0.3,-10,7,10); ctx.fillRect(2-bein*0.3,-10,7,10); // Beine
  ctx.fillRect(-12,-30,24,22);                    // Koerper
  ctx.beginPath(); ctx.arc(0,-31,11,0,7); ctx.fill(); // Kopf
  ctx.fillStyle=farbe; ctx.fillRect(-12,-36,24,6);  // Stirnband
  ctx.beginPath(); ctx.moveTo(-blick*12,-34); ctx.lineTo(-blick*26,-40+Math.sin(lauf*10)*4); ctx.lineTo(-blick*24,-30); ctx.fill(); // Band-Enden
  ctx.fillStyle='#fff'; ctx.fillRect(blick>0?1:-8,-31,7,3); // Augen-Schlitz
  ctx.fillStyle=farbe; ctx.fillRect(-12,-19,24,3); // Guertel
  ctx.restore();
}
function zeichne(){
  let fx=ich.x;
  if(TV){ let m=null; for(const p of st.spieler){const g=geister[p.id]; if(g&&(m===null||g.x>m)) m=g.x;} fx=m===null?0:m; }
  let kam=Math.max(0,Math.min((COLS*T)-W, fx-W*0.38));
  // Hintergrund: Himmel+Mond aus dem Cache, Berge (Parallax) + Sterne
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.drawImage(bgC,0,0);
  ctx.setTransform(skala,0,0,skala,0,0);
  ctx.fillStyle='#2a1a40'; ctx.beginPath(); for(let i=-1;i<12;i++){const bx=i*260-(kam*0.25)%260; ctx.moveTo(bx,WH); ctx.lineTo(bx+130,WH-260-(i%3)*40); ctx.lineTo(bx+260,WH);} ctx.fill();
  if(!LEICHT){ ctx.fillStyle='#ff3b5c18'; for(let i=0;i<30;i++){const sx=(i*137-kam*0.1)%W; ctx.fillRect((sx+W)%W,(i*71)%300,2,2);} }
  // Kacheln
  const c0=Math.max(0,Math.floor(kam/T)), c1=Math.min(COLS-1,Math.ceil((kam+W)/T));
  for(let cx=c0;cx<=c1;cx++){ const sp=karte[cx]; for(let cy=0;cy<ROWS;cy++){ const k=sp[cy]; if(!k) continue; const x=cx*T-kam, y=cy*T;
    if(k===1){ ctx.fillStyle=(cx+cy)%2?'#3a3150':'#352c4a'; ctx.fillRect(x,y,T,T); if(!kachel(cx,cy-1)||kachel(cx,cy-1)>1){ ctx.fillStyle='#6fcf6f'; ctx.fillRect(x,y,T,6);}
      ctx.fillStyle='#00000030'; ctx.fillRect(x,y+T-3,T,3); }
    else if(k===2){ ctx.fillStyle='#ff3b5c'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+i*13,y+T); ctx.lineTo(x+i*13+7,y+14); ctx.lineTo(x+i*13+14,y+T); ctx.fill(); } }
    else if(k===3){ ctx.fillStyle='#ccc'; ctx.fillRect(x+18,y+2,4,T-2); ctx.fillStyle=(ich&&ich.cp>=cx*T)?'#2ea043':'#ffd23f'; ctx.beginPath(); ctx.moveTo(x+22,y+4); ctx.lineTo(x+40,y+11); ctx.lineTo(x+22,y+18); ctx.fill(); }
    else if(k===4){ for(let yy=0;yy<4;yy++)for(let xx=0;xx<4;xx++){ ctx.fillStyle=(xx+yy)%2?'#fff':'#000'; ctx.fillRect(x+xx*10,y-40+yy*10,10,10);} ctx.fillStyle='#ccc'; ctx.fillRect(x-3,y-44,4,T+44);
      ctx.fillStyle='#ffd23f'; ctx.font='bold 18px system-ui'; ctx.textAlign='center'; ctx.fillText('ZIEL',x+20,y-52); }
  } }
  // Fortschritt oben (eigene Markierung groesser + weiss umrandet)
  const bar=W<700?W-40:W-360; ctx.fillStyle='#0008'; ctx.fillRect(20,16,bar,10);
  for(const p of st.spieler){ const eigen=!TV&&p.id===id, gx=eigen?ich.x:(geister[p.id]?geister[p.id].x:0), px=20+Math.min(1,gx/ZIEL_X)*bar;
    ctx.fillStyle=p.farbe; if(eigen){ ctx.fillRect(px-5,9,10,24); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(px-5,9,10,24); } else ctx.fillRect(px-3,12,6,18); }
  // Geister (andere Spieler): halbtransparent, Namensschild in Spielerfarbe
  const t=performance.now()/1000, schilder=[];
  schilderNeu();
  for(const p of st.spieler){ if(p.id===id||(!p.x&&!p.y)) continue; const gg=geister[p.id]||(geister[p.id]={x:p.x,y:p.y,ax:p.x});
    gg.ax=gg.x; gg.x+=(p.x-gg.x)*0.3; gg.y+=(p.y-gg.y)*0.3; const b=gg.x>=gg.ax?1:-1;
    const sx=gg.x-kam; if(sx<-60||sx>W+60) continue;
    ninja(sx,gg.y,p.farbe,TV?(p.lebt?1:.35):(p.lebt?.5:.2),b,false,t+gg.x/100); schilder.push([p,sx+PW/2,gg.y+PH-43]); }
  for(const [p,x,y] of schilder) beschriftung(p,x,y,false);
  if(!TV&&id&&ich){ const me=ich_p(); ninja(ich.x-kam,ich.y,me.farbe,ich.lebt?1:.6,ich.blick,true,ich.vx?ich.x/80:0);
    beschriftung(me,ich.x-kam+PW/2,ich.y+PH-49,true); }
  partikel=partikel.filter(q=>(q.t-=1/60)>0); ctx.fillStyle='#fff8'; for(const q of partikel){ q.x+=q.vx/60; q.y+=q.vy/60; ctx.fillRect(q.x-kam,q.y,3,3); }
  hud();
}
function zeit(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function txt(s,x,y,gr,farbe='#fff'){ctx.font='bold '+gr+'px system-ui';ctx.lineWidth=Math.max(3,gr/9);ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle=farbe;ctx.fillText(s,x,y);}
const nWert=p=>p.ziel?('✔ '+p.ziel.toFixed(1)+' s'):(p.best+' m');
function hud(){
  const rest=Math.max(0,st.rest-(performance.now()-stZeit)/1000); ctx.textAlign='center'; ctx.textBaseline='alphabetic'; countdownTon(rest);
  const tx=W<700?Math.max(70,W*0.22):W/2-140; // Uhr/Titel links neben der Rangliste
  if(st.phase==='lobby'){ txt(TV?'NINJA-RACE':'Ueb schon mal!',tx,72,40,'#ff3b5c');
    txt(TV?(st.spieler.length+' Ninjas bereit  ·  '+location.host):'Warte auf den Start...',tx,104,20); }
  else if(st.phase==='countdown') txt(String(Math.ceil(rest)||'LOS'),W/2,WH/2,130,'#ffd23f');
  else if(st.phase==='spiel'){ txt(zeit(rest),tx,72,42);
    if(!TV){ if(zielZeit!==null) txt('IM ZIEL!  '+zielZeit.toFixed(1)+' s',W/2,WH/2-60,46,'#ffd23f');
      else if(!ich.lebt) txt('AUTSCH!',W/2,WH/2-60,40,'#ff3b5c'); } }
  rangliste(W-(TV?330:250),40,TV?315:235,'RENNEN','#ff3b5c',TV?12:8,nWert);
  if(st.phase==='ende') endeScreen('ZEIT VORBEI!',WH,nWert);
  if(TV) document.getElementById('tvbtn').textContent=(st.phase==='spiel'||st.phase==='countdown')?'ABBRECHEN':'START';
}
// ================= Schleife (feste 120-Hz-Physik, Zeichnen per requestAnimationFrame)
baue(1); neu(); netz();
let alt=performance.now(), akku=0;
function lauf(t){ frameMessen(t-alt); akku+=Math.min(.1,(t-alt)/1000); alt=t; while(akku>=1/120){ schritt(1/120); akku-=1/120; } zeichne(); requestAnimationFrame(lauf); }
requestAnimationFrame(lauf);
</script></body></html>
