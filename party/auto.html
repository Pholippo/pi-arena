<!doctype html><html lang=de><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>AUTO-PARTY</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2b;font-family:system-ui,Segoe UI,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#form{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1a2bee;z-index:5}
#form div{text-align:center}
#form h1{font-size:44px;margin:0 0 6px;color:#ffd23f;text-shadow:0 4px 0 #b8860b}
#form input{font-size:26px;padding:10px 14px;border-radius:12px;border:0;text-align:center;width:240px}
#form button,#tvbtn{font-size:24px;padding:12px 26px;border:0;border-radius:14px;background:#2ea043;color:#fff;
  font-weight:700;margin-top:14px;cursor:pointer}
#tvbtn{position:fixed;right:18px;bottom:18px;z-index:4;display:none}
/* PARTY-UI-CSS-START (gleich in ninja/flappy/auto) */
#hilfe{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.66);color:#fff;font:600 15px system-ui,sans-serif;padding:6px 6px 6px 16px;border-radius:999px;
  max-width:calc(100vw - 32px);box-sizing:border-box;white-space:nowrap;overflow:hidden}
#hilfe span{overflow:hidden;text-overflow:ellipsis}
#hilfe button{flex:none;border:0;border-radius:50%;width:30px;height:30px;background:rgba(255,255,255,.22);color:#fff;
  font:700 18px system-ui,sans-serif;cursor:pointer;padding:0}
#hilfe.zu{padding:6px;left:auto;right:12px;transform:none}
#hilfe.zu span{display:none}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:16px;z-index:3;pointer-events:none;box-sizing:border-box}
#touch div{display:flex;gap:16px}
#touch button{pointer-events:auto;width:clamp(92px,25vmin,140px);height:clamp(92px,25vmin,140px);border-radius:50%;
  border:3px solid rgba(255,255,255,.55);font:800 40px system-ui,sans-serif;background:rgba(255,255,255,.2);color:#fff;
  touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#touch button.on{background:rgba(255,255,255,.6);color:#000}
#touch button small{display:block;font-size:15px;font-weight:800;letter-spacing:1px}
body.touch #hilfe{bottom:calc(clamp(92px,25vmin,140px) + 30px);font-size:13px}
/* PARTY-UI-CSS-ENDE */
</style></head><body>
<canvas id=c></canvas>
<div id=form><div><h1>AUTO-PARTY</h1><p>Wie heisst du?</p>
<input id=name maxlength=14 autocomplete=off><br><button id=los>Einsteigen!</button>
<p style="opacity:.7">&#9664; &#9654; / A D / links-rechts tippen = Spur wechseln<br>&#9650; / W = Turbo</p></div></div>
<div id=touch><div><button data-k=l>&#9664;</button><button data-k=r>&#9654;</button></div><div><button data-k=t>&#9650;<small>TURBO</small></button></div></div>
<button id=tvbtn>START</button>
<script>
window.onerror=(m)=>{window.__err=String(m);};
// ---------- Welt (muss bei allen gleich sein -> Verkehr aus dem Seed)
const COLS=4, SPUR=100, STRASSE=COLS*SPUR, ALEN=86, ABR=48;
const V0=280, VMAX=620, BESCHL=7, TURBO=140, SPURTEMPO=9, SCHUTZ=1.5;
const V0_PLUS=120, VMAX_PLUS=120; // im Lauf der Runde: Start- und Hoechsttempo steigen bis Rundenende um diese Werte
// VERKEHR-START
const ABST=260, U=150; // Abstand der Verkehrs-Reihen (px Strecke) und feste Eigengeschwindigkeit aller Gegner
// Erlaubte Belegungen einer Reihe: nie mehr als 2 Autos und nie zwei nebeneinander am Rand ({0,1},{2,3}),
// damit man von JEDER freien Spur mit hoechstens 1 Spurwechsel an der naechsten Reihe vorbeikommt.
const MUSTER1=[[0],[1],[2],[3]], MUSTER2=[[0,2],[0,3],[1,2],[1,3]];
// Schwierigkeit waechst mit der Rundenzeit: stufe 0..STUFEN-1 (setzt die Spielschleife, wenn eine Reihe zum ersten Mal
// gebraucht wird). Je Stufe [Anteil leere Reihen, Anteil leer+1 Auto]; der Rest hat 2 Autos. Weil jede Reihe nur erlaubte
// Muster nutzt, gilt die Spurwechsel-Garantie fuer JEDE Kombination von Stufen benachbarter Reihen.
const STUFEN=6, DICHTE=[[0.15,0.55],[0.10,0.45],[0.06,0.35],[0.03,0.26],[0.01,0.17],[0,0.10]], LKW=[0.15,0.18,0.21,0.24,0.27,0.30];
let stufe=0;
const AFARBEN=['#e63946','#f4a261','#2a9d8f','#e9c46a','#8338ec','#3a86ff','#ff006e','#fb8500','#adb5bd','#06d6a0'];
function zufall(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seed=1, reihenCache={};
function reihe(i){ // Reihe i: Liste {spur,farbe,lkw}; Weltposition = i*ABST + U*T
  const k=seed+':'+i; if(reihenCache[k]) return reihenCache[k];
  const s=Math.max(0,Math.min(STUFEN-1,stufe|0)), d=DICHTE[s];
  const r=zufall((seed*1000003+i*7919)>>>0); r();
  const w=r(); let m=[];
  if(w<d[0]) m=[]; else if(w<d[1]) m=MUSTER1[Math.floor(r()*4)]; else m=MUSTER2[Math.floor(r()*4)];
  return reihenCache[k]=m.map(sp=>({spur:sp,farbe:AFARBEN[Math.floor(r()*AFARBEN.length)],lkw:r()<LKW[s]}));
}
function reihePos(i,T){return i*ABST+U*T;}
// VERKEHR-ENDE
// ---------- PARTY-UI-START (gleicher Block in ninja/flappy/auto: Leicht-Modus, Namensschilder, Rangliste, Ende, Hilfe, Touch)
// Erwartet im Spiel: ctx, W, st, id, TV, ton(), ac, groesse()
const UIQ=new URLSearchParams(location.search), UA=navigator.userAgent||'';
// Schwaches Geraet (Raspberry Pi: Linux aarch64/arm ohne Android) oder ?leicht=1 -> Pixeldichte 1, weniger Deko
let LEICHT=UIQ.get('leicht')==='1'||(/Linux (aarch64|arm)/i.test(UA)&&!/Android/i.test(UA));
const TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
function pixelRatio(){return LEICHT?1:Math.min(2,window.devicePixelRatio||1);}
function canvasGroesse(cv){ // true, wenn sich die Pixelgroesse wirklich geaendert hat (sonst kein Reset/Neuaufbau)
  const d=pixelRatio(), w=Math.max(1,Math.round(innerWidth*d)), h=Math.max(1,Math.round(innerHeight*d));
  if(cv.width===w&&cv.height===h) return false; cv.width=w; cv.height=h; return true; }
let ftMittel=16, ftAnz=0;
function frameMessen(ms){ // Framezeit dauerhaft > 25 ms -> automatisch in den Leicht-Modus
  if(LEICHT||document.hidden||!(ms>0)||ms>250) return;
  ftMittel+=(ms-ftMittel)*0.05; if(++ftAnz>120&&ftMittel>25){ LEICHT=true; groesse(); } }
addEventListener('pointerdown',()=>{try{ if(ac&&ac.state==='suspended') ac.resume(); }catch(e){}},true);
function hell(f){const m=/^#?([0-9a-f]{6})/i.exec(f||''); if(!m) return false; const n=parseInt(m[1],16);
  return 0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255)>150;}
function pfad(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const tbCache={};
function textBreite(t,font){const k=font+'|'+t; let w=tbCache[k]; if(w===undefined){ctx.font=font; w=tbCache[k]=ctx.measureText(t).width;} return w;}
let belegt=[]; // Schilder dieses Frames (zum Stapeln statt Ueberlappen); schilderNeu() am Frame-Anfang
function schilderNeu(){ belegt=[]; }
function schild(text,x,y,farbe,fs,alpha,eigen,frei){ // Namensschild (Pill in Spielerfarbe); Mitte x, Unterkante y -> Hoehe (+ Versatz nach oben)
  const font='bold '+fs+'px system-ui,sans-serif', h=Math.round(fs*1.45), w=textBreite(text,font)+fs*1.1;
  let auf=0; if(frei){ for(let n=0;n<8&&belegt.some(b=>x-w/2<b[1]&&x+w/2>b[0]&&y-auf-h<b[3]&&y-auf>b[2]);n++) auf+=h+2; y-=auf; belegt.push([x-w/2,x+w/2,y-h,y]); }
  ctx.save(); ctx.globalAlpha=alpha; pfad(x-w/2,y-h,w,h,h/2); ctx.fillStyle=farbe; ctx.fill();
  ctx.lineWidth=eigen?3:1.5; ctx.strokeStyle=eigen?'#fff':'rgba(0,0,0,.55)'; ctx.stroke();
  ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=hell(farbe)?'#111':'#fff';
  ctx.fillText(text,x,y-h/2+1); ctx.restore(); return h+auf; }
function duMarker(x,y){ // gelber Pfeil + "DU" ueber dem eigenen Spieler; y = Pfeilspitze
  y+=Math.sin(performance.now()/170)*3;
  ctx.save(); ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#000'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-11,y-13); ctx.lineTo(x+11,y-13); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.font='900 18px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.lineWidth=4;
  ctx.strokeText('DU',x,y-16); ctx.fillText('DU',x,y-16); ctx.restore(); }
function krone(x,y,s){ // y = Unterkante
  ctx.save(); ctx.fillStyle='#ffd700'; ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x-s,y); ctx.lineTo(x-s,y-s*0.9); ctx.lineTo(x-s*0.5,y-s*0.45); ctx.lineTo(x,y-s*1.15); ctx.lineTo(x+s*0.5,y-s*0.45);
  ctx.lineTo(x+s,y-s*0.9); ctx.lineTo(x+s,y); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore(); }
function fuehrender(){ const p=st.spieler&&st.spieler[0]; return p&&(st.phase==='spiel'||st.phase==='ende')&&(p.best>0||p.ziel)?p.id:null; }
function beschriftung(p,x,y,eigen){ // Schild (+Krone fuer den Fuehrenden, +DU-Pfeil) ueber einer Figur; y = Oberkante der Figur
  const fs=TV?22:(eigen?17:14); let top=y-5;
  top-=schild(p.name+(p.ziel?' ✔':''),x,top,p.farbe,fs,eigen||TV?1:0.82,eigen,true);
  if(p.id===fuehrender()){ const s=TV?14:9; krone(x,top-3,s); top-=s*1.15+4; }
  if(eigen) duMarker(x,top-3);
}
function ich_p(){ return st.spieler.find(p=>p.id===id)||{id,name:meinName||'?',farbe:'#ffd23f',best:0}; }
function rangliste(x,y,br,titel,tfarbe,max,wert){ // eigene Zeile hervorgehoben; ausserhalb der Top-N wird sie angehaengt
  if(!TV&&W<600){ max=Math.min(max,3); br=Math.min(br,Math.max(150,W*0.58)); x=W-br-8; } // Handy hochkant: kompakt
  const eng=!TV&&W<600, zh=TV?32:(eng?21:24), fs=TV?20:(eng?13:15), alle=st.spieler, liste=alle.slice(0,max).map((p,i)=>[p,i+1]);
  const mi=alle.findIndex(p=>p.id===id); if(!TV&&mi>=max) liste.push([alle[mi],mi+1]);
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(x,y,br,32+liste.length*zh);
  ctx.textBaseline='alphabetic'; ctx.font='bold '+fs+'px system-ui,sans-serif'; ctx.textAlign='left'; ctx.fillStyle=tfarbe; ctx.fillText(titel,x+12,y+22);
  liste.forEach(([p,rang],k)=>{ const yy=y+24+(k+1)*zh, eigen=!TV&&p.id===id;
    if(eigen){ ctx.globalAlpha=0.4; ctx.fillStyle=p.farbe; ctx.fillRect(x+4,yy-zh+7,br-8,zh-2); ctx.globalAlpha=1;
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(x+4,yy-zh+7,br-8,zh-2);
      ctx.fillStyle='#ffd23f'; ctx.textAlign='right'; ctx.fillText('DU ▶',x-6,yy); }
    pfad(x+12,yy-fs*0.82,fs*0.85,fs*0.85,3); ctx.fillStyle=p.farbe; ctx.fill(); ctx.strokeStyle='#0008'; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle=rang===1&&p.id===fuehrender()?'#ffd700':(eigen?'#fff':'#e8e8e8');
    ctx.fillText(rang+'. '+p.name,x+fs+20,yy);
    ctx.textAlign='right'; ctx.fillText(wert(p),x+br-12,yy); });
  ctx.restore(); }
function endeScreen(titel,hoehe,wert){ // Rundenende: Siegertreppchen Top 3 + eigener Platz
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.82)'; ctx.fillRect(0,0,W,hoehe); ctx.textBaseline='alphabetic'; ctx.textAlign='center';
  ctx.font='bold 54px system-ui,sans-serif'; ctx.lineWidth=6; ctx.strokeStyle='#000'; ctx.fillStyle='#ffd23f';
  ctx.strokeText(titel,W/2,84); ctx.fillText(titel,W/2,84);
  const basis=hoehe-125, med=['#ffd700','#c0c0c0','#cd7f32'], hoch=[165,125,100], bw=Math.min(160,(W-24)/3.4), dx=[0,-bw*1.12,bw*1.12];
  st.spieler.slice(0,3).forEach((p,i)=>{ const x=W/2+dx[i], top=basis-hoch[i];
    ctx.fillStyle=med[i]; ctx.fillRect(x-bw/2,top,bw,hoch[i]); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x-bw/2,top+hoch[i]-10,bw,10);
    ctx.fillStyle='#000'; ctx.font='900 '+(i?40:56)+'px system-ui,sans-serif'; ctx.fillText(String(i+1),x,top+(i?46:62));
    ctx.font='bold 18px system-ui,sans-serif'; ctx.fillText(wert(p),x,top+hoch[i]-16);
    const h=schild(p.name,x,top-8,p.farbe,i?20:24,1,!TV&&p.id===id);
    if(i===0) krone(x,top-14-h,16); });
  if(!st.spieler.length){ ctx.font='bold 22px system-ui,sans-serif'; ctx.fillStyle='#fff'; ctx.fillText('Niemand dabei',W/2,basis-60); }
  ctx.font='bold 22px system-ui,sans-serif'; ctx.fillStyle='#fff';
  const mi=st.spieler.findIndex(p=>p.id===id);
  if(!TV&&mi>=0){ const p=st.spieler[mi]; ctx.fillStyle=mi<3?'#ffd23f':'#fff'; ctx.fillText('Du: Platz '+(mi+1)+' von '+st.spieler.length+'  ·  '+wert(p),W/2,basis+40); }
  ctx.fillStyle='#ccc'; ctx.font='20px system-ui,sans-serif'; ctx.fillText(TV?'START = neue Runde':'Gleich geht\'s weiter...',W/2,basis+80);
  ctx.restore(); }
let cdAlt=0;
function countdownTon(rest){ // Piep pro Sekunde, letzte 3 hoeher; "LOS" spielt der Phasenwechsel
  if(st.phase!=='countdown'){ cdAlt=0; return; } const n=Math.ceil(rest);
  if(n>0&&n!==cdAlt){ cdAlt=n; ton(n<=3?660:440,.14,'triangle',.09); } }
function hilfe(text){ // kurze Steuerungshilfe unten, mit x ausblendbar (merkt sich das), Taste H schaltet um
  if(TV) return; const d=document.createElement('div'); d.id='hilfe';
  d.innerHTML='<span></span><button type=button aria-label="Hilfe ein/aus"></button>'; d.firstChild.textContent=text;
  document.body.appendChild(d); const b=d.querySelector('button'); let zu=false;
  try{ zu=localStorage.getItem('party_hilfe')==='zu'; }catch(e){}
  const setz=(z,merken=true)=>{ zu=z; d.classList.toggle('zu',z); b.textContent=z?'?':'×'; if(merken) try{ localStorage.setItem('party_hilfe',z?'zu':'auf'); }catch(e){} };
  setz(zu,false); if(TOUCH&&!zu) setTimeout(()=>{ if(!zu) setz(true,false); },9000); // am Handy nach 9 s von selbst klein b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setz(!zu);});
  addEventListener('keydown',e=>{ if((e.key==='h'||e.key==='H')&&document.activeElement!==document.getElementById('name')) setz(!zu); }); }
function touchKnoepfe(bei){ // grosse Touch-Knoepfe (#touch button[data-k]) -> bei(k, gedrueckt)
  const t=document.getElementById('touch'); if(TV||!TOUCH||!t) return; t.style.display='flex'; document.body.classList.add('touch');
  t.querySelectorAll('button').forEach(b=>{ const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); try{ b.setPointerCapture(e.pointerId); }catch(_){}
      b.classList.add('on'); bei(k,true); });
    const los=()=>{ if(!b.classList.contains('on')) return; b.classList.remove('on'); bei(k,false); };
    b.addEventListener('pointerup',los); b.addEventListener('pointercancel',los); b.addEventListener('lostpointercapture',los);
    b.addEventListener('contextmenu',e=>e.preventDefault()); }); }
// ---------- PARTY-UI-ENDE
// ---------- Zustand
const TV=location.pathname.startsWith('/tv');
const QNAME=(new URLSearchParams(location.search).get('name')||'').trim().slice(0,14); // aus MEGA-PARTY: kein Tippen
let autoLaeuft=false;
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
let W=800, H=600, skala=1, spriteCache={};
function groesse(){ // nur bei echter Groessenaenderung; Auto-/Baum-Sprites danach neu (Offscreen-Canvas)
  if(!canvasGroesse(cv)) return;
  skala=Math.min(cv.height/600, cv.width/(STRASSE+90)); W=cv.width/skala; H=cv.height/skala; spriteCache={}; for(const k in tbCache) delete tbCache[k]; }
addEventListener('resize',groesse);groesse();
let id=localStorage.getItem('auto_id')||'', meinName=localStorage.getItem('auto_name')||'';
let st={phase:'lobby',rest:0,spieler:[],runde_s:180}, stZeit=performance.now();
let ich, phaseAlt='', anzeige={}, teile=[], T=0, turbo=false, blitz=0, stufeAlt=0, stufeZeit=-9;
function neu(){ich={x:0,spur:1,ziel:1,lebt:true,tot:0,tl:0,v:V0};} neu(); // x = gefahrene Strecke
function fortschritt(){return st.phase==='spiel'?Math.max(0,Math.min(1,T/(st.runde_s||180))):0;}
// ---------- Sound (kleine Beeps)
let ac=null;function ton(f,d=0.07,typ='square',vol=0.05){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();
  o.type=typ;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d+0.02)}catch(e){}}
// ---------- Eingabe
function lenk(d){ if(TV||!ich.lebt) return; const z=Math.max(0,Math.min(COLS-1,ich.ziel+d)); if(z!==ich.ziel){ich.ziel=z;ton(520+z*60,.04,'triangle',.04);} }
addEventListener('keydown',e=>{ if(document.activeElement===document.getElementById('name')) return;
  if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();if(!e.repeat)lenk(-1);}
  if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();if(!e.repeat)lenk(1);}
  if(['ArrowUp','w','W'].includes(e.key)){e.preventDefault();turbo=true;} });
addEventListener('keyup',e=>{ if(['ArrowUp','w','W'].includes(e.key)) turbo=false; });
addEventListener('blur',()=>{turbo=false;});
cv.addEventListener('pointerdown',e=>{e.preventDefault();lenk(e.clientX<innerWidth/2?-1:1);});
touchKnoepfe((k,an)=>{ if(k==='t') turbo=an; else if(an) lenk(k==='l'?-1:1); });
hilfe(TOUCH?'◀ ▶ Spur wechseln · TURBO halten · Autos ausweichen':'◀ ▶ / A D Spur wechseln · ▲ / W Turbo · Autos ausweichen · H = Hilfe aus');
// ---------- Anmeldung
const form=document.getElementById('form'), nameEl=document.getElementById('name');
nameEl.value=meinName;
async function post(pfad,daten){const b=new URLSearchParams(daten).toString();
  const r=await fetch(pfad,{method:'POST',body:b,headers:{'Content-Type':'application/x-www-form-urlencoded'}});return r.json();}
async function anmelden(){meinName=(nameEl.value||'').trim()||'Flitzer';localStorage.setItem('auto_name',meinName);
  try{const r=await post('/join',{name:meinName,id});id=r.id;localStorage.setItem('auto_id',id);form.style.display='none';nameEl.blur();ton(880,.12,'triangle',.08);}
  catch(e){alert('Keine Verbindung zum Host');}}
document.getElementById('los').onclick=anmelden;
if(QNAME&&!TV){nameEl.value=QNAME;form.style.display='none';autoLaeuft=true;anmelden().finally(()=>autoLaeuft=false);}
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')anmelden();});
if(TV){form.style.display='none';const b=document.getElementById('tvbtn');b.style.display='block';
  b.onclick=()=>post(st.phase==='spiel'||st.phase==='countdown'?'/lobby':'/start',{});}
else if(id&&meinName){anmelden();}
// ---------- Netzwerk: 10x pro Sekunde eigene Position hoch, alle anderen runter
// x = gefahrene Strecke (px), y = Querposition auf der Strasse (px, 0..400)
async function netz(){
  try{
    let r;
    if(TV||!id){r=await (await fetch('/state')).json();}
    else{r=await post('/upd',{id,x:ich.x.toFixed(1),y:(ich.spur*SPUR+SPUR/2).toFixed(1),lebt:ich.lebt?'1':'0',ziel:''});
      if(!r.ich){id='';localStorage.removeItem('auto_id');if(QNAME&&!TV){if(!autoLaeuft){autoLaeuft=true;anmelden().finally(()=>autoLaeuft=false);}}else form.style.display='flex';}}
    if(r.spiel && r.spiel!=='auto'){location.reload();return;} // Host hat das Spiel gewechselt
    if(r.seed!==seed){seed=r.seed;reihenCache={};}
    st=r;stZeit=performance.now();

  const vor=Math.floor((ich.x-U*T)/ABST); ich.x+=ich.v*dt; const nach=Math.floor((ich.x-U*T)/ABST);
  if(nach>vor && reihe(nach).length) ton(1046,.04,'square',.025);
  if(ich.tl>SCHUTZ && kollision()){ ich.lebt=false; ich.tot=0; boom(); ton(160,.35,'sawtooth',.08); setTimeout(()=>ton(90,.3,'sawtooth',.06),80); }
}

function hash(k){let t=Math.imul(k^0x9e3779b9,0x85ebca6b);t^=t>>>13;t=Math.imul(t,0xc2b2ae35);return((t^t>>>16)>>>0)/4294967296;}
function zeichne(){

function zeit(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
